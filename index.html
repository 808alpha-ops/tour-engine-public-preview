      (() => {
        const params = new URLSearchParams(window.location.search);
        const redirectPath = params.get('ghPagesRoute');

        params.delete('ghPagesRoute');
        const restoredSearch = params.toString();
        const basePath = '/tour-engine-public-preview/'.replace(/\/$/, '');
        const restoredPath = `${basePath}${redirectPath.startsWith('/') ? redirectPath : `/${redirectPath}`}`;
        window.history.replaceState(
          null,
          '',
          `${restoredPath}${restoredSearch ? `?${restoredSearch}` : ''}${window.location.hash}`
        );
      })();
