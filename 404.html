<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Engine — redirecting</title>
    <script>
      (() => {
        const previewBase = '/tour-engine-public-preview/';
        const { pathname, search, hash } = window.location;
        const routePath = pathname.startsWith(previewBase)
          ? `/${pathname.slice(previewBase.length)}`
          : pathname;
        const params = new URLSearchParams(search);
        params.set('ghPagesRoute', routePath === '/' ? '/' : routePath.replace(/\/$/, ''));
        window.location.replace(`${previewBase}?${params.toString()}${hash}`);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Tour Engine…</p>
  </body>
</html>
